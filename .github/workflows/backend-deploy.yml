name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting Backend Deployment..."
            
            # Navigate to application directory
            cd /opt/hrms
            
            # Clone repo if it doesn't exist, otherwise pull latest changes
            if [ ! -d "Client-Code" ]; then
              git clone https://github.com/xyushman/Client-Code.git
            fi
            
            cd Client-Code
            git checkout main
            git pull origin main
            
            # Go to backend folder
            cd backend/hrms
            
            # Build the new Docker image
            echo "Building Docker image..."
            docker build -t hrms-backend:latest .
            
            # Stop and remove the old container if it exists
            echo "Stopping old container..."
            docker stop hrms-backend-container || true
            docker rm hrms-backend-container || true
            
            # Run the new container on port 80, injecting environment variables
            echo "Starting new container..."
            docker run -d \
              --name hrms-backend-container \
              -p 80:8080 \
              --env-file /opt/hrms/.env \
              --restart unless-stopped \
              hrms-backend:latest
              
            echo "Deployment successful!"
